name: Security Baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked secrets and forbidden files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|\.env\.local$|id_rsa$|private\.key$)'; then
            echo 'Potential secret material tracked'; exit 1
          fi
          echo 'Tracked-secret filename check passed'
